version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: dashbord
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
  backend:
    build:
      context: ./backend
    env_file:
      - backend/.env.example
    ports:
      - '4000:4000'
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
  frontend:
    build:
      context: ./frontend
    env_file:
      - frontend/.env.example
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
volumes:
  mongo-data:
